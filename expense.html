<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width:device-width; initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/expense.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>

        <main>

            <aside>
                <h1>Expense Tracker</h1>
                <nav>
                    <a href="index.html">Dashboard</a>
                    <a href="expense.html" class="active">Expenses</a>
                </nav>
            </aside>

            <section>

                <header>
                    <h2>Expenses</h2>
                    <button id="addExpense">Add Expense</button>
                </header>

                <input type="text" placeholder="Search expenses..." id="search">

                <div class="search-filters">
                    <button>All Categories</button>
                    <button>Date</button>
                    <button>Amount</button>
                </div>

                <table>
                    <thead>
                        <tr class="expense">
                            <th>Title</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>

                <footer>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button><i class="fa-solid fa-forward"></i></button>
                </footer>
                
                <dialog id="add-expense-dialog">
                    <div class="dialog-content">
                        <h2>Add Expense</h2>
                        <input type="text" placeholder="Enter expense title..." id="expense-title-dlg">
                        <select id="expense-category-dlg">
                            <option value="Health">Health</option>
                            <option value="Grocery">Grocery</option>
                            <option value="Travel">Travel</option>
                        </select>
                        <input type="number" placeholder="Enter expense amount..." id="expense-amount-dlg">
                        <textarea placeholder="Enter expense notes..." id="expense-notes-dlg"></textarea>
                        <div class="popup-actions">
                            <button id="btn-add-expense-dlg">Add</button>
                            <button id="btn-close-expense-dlg">Close</button>
                        </div>
                    </div>
                </dialog>
                

            </section>

        </main>

        <script src="js/expense.js"></script>

    </body>
</html>
