<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width:device-width; initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/expense.css">
    </head>
    <body>

        <main>

            <aside>
                <h1>Expense Tracker</h1>
                <nav>
                    <a href="index.html">Dashboard</a>
                    <a href="expense.html" class="active">Expenses</a>
                </nav>
            </aside>

            <section>

                <header>
                    <h2>Expenses</h2>
                    <button>+ Add</button>
                </header>

                <input type="text" placeholder="Search expenses..." id="search">

                <div class="search-filters">
                    <button>All Categories</button>
                    <button>Date</button>
                    <button>Amount</button>
                </div>

                <table>
                    <thead>
                        <tr class="expense">
                            <th>Title</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>

                <footer>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>-></button>
                </footer>
                

            </section>

        </main>

        <script src="js/script.js"></script>

    </body>
</html>
