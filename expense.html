<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/expense.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>

        <main>

            <aside>
                <h1>Expense Tracker</h1>
                <nav>
                    <a href="index.html">Dashboard</a>
                    <a href="expense.html" class="active">Expenses</a>
                </nav>
            </aside>

            <section>

                <header>
                    <h2>Expenses</h2>
                    <button id="addExpense">Add Expense</button>
                </header>

                <input type="text" placeholder="Search expenses..." id="search">

                <div class="search-filters">
                    <select id="category-filter">
                        <option value="All Categories">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Others">Others</option>
                    </select>
                    <input type="date" id="dateFilter">
                    <button id="amount-range">Amount Range</span></button>
                </div>

                <table>
                    <thead>
                        <tr class="expense">
                            <th>Title</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>

                <footer>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button><i class="fa-solid fa-forward"></i></button>
                </footer>
                
                <dialog id="add-expense-dialog">
                    <div class="dialog-content">
                        <h2>Add Expense</h2>
                        <input type="text" placeholder="Enter expense title..." id="expense-title-dlg">
                        <select id="expense-category-dlg">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="number" placeholder="Enter expense amount..." id="expense-amount-dlg">
                        <textarea placeholder="Enter expense notes..." id="expense-notes-dlg"></textarea>
                        <input type="date" placeholder="Enter expense date..." id="expense-date-dlg">
                        <div class="popup-actions">
                            <button id="btn-add-expense-dlg">Add</button>
                            <button id="btn-close-expense-dlg">Close</button>
                        </div>
                    </div>
                </dialog>

                <dialog id="view-expense-dialog">

                    <h2>Expense Details</h2>

                    <div class="expense-dialog">
                        
                        <p><b>Title:</b> <span id="view-expense-title"></span></p>
                        
                        <p><b>Category:</b> <span id="view-expense-category"></span></p>

                        <p><b>Amount:</b> <span id="view-expense-amount"></span></p>

                        <p><b>Notes:</b> <span id="view-expense-notes"></span></p>

                        <p><b>Date Created:</b> <span id="view-expense-date-created"></span></p>

                        <p><b>Date Modified:</b> <span id="view-expense-date-modified"></span></p>

                    </div>

                    <button id="close-view-expense-dialog">Close</button>

                </dialog>

                <dialog id="update-expense-dialog">
                    <div class="dialog-content">
                        <h2>Update Expense</h2>
                        <input type="text" placeholder="Enter expense title..." id="update-expense-title-dlg">
                        <select id="update-expense-category-dlg">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="number" placeholder="Enter expense amount..." id="update-expense-amount-dlg">
                        <textarea placeholder="Enter expense notes..." id="update-expense-notes-dlg"></textarea>
                        <div class="popup-actions">
                            <button id="btn-update-expense-dlg">Update</button>
                            <button id="btn-close-update-expense-dlg">Close</button>
                        </div>
                    </div>
                </dialog>

                <dialog id="amount-range-dialog">
                    <div class="amnt-rng-dlg-content">

                        <h2>Enter Amount Range</h2>
                        
                        <div class="input-section">
                            <label for="amount-range-start">Range Start</label>
                            <input type="number" placeholder="Enter Range Start" id="amount-range-start">
                        </div>

                        <div class="input-section">
                            <label for="amount-range-end">Range End</label>
                            <input type="number" placeholder="Enter Range End" id="amount-range-end">
                        </div>

                        <div class="actions">
                            <button id="amnt-range-apply">Apply</button>
                            <button id="amnt-range-clear">Clear</button>
                        </div>
                    </div>
                </dialog>
                

            </section>

        </main>

        <script src="js/expense.js"></script>

    </body>
</html>
