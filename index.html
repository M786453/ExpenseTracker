<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body>

        <main>

            <aside>
                <h1>Expense Tracker</h1>
                <nav>
                    <a href="index.html" class="active">Dashboard</a>
                    <a href="expense.html">Expenses</a>
                </nav>
            </aside>

            <section>

                <h2>Dashboard</h2>

                <article>

                    <h3>Expense Summary</h3>

                    <div class="expense-summary">

                        <div class="summary-card">
                            <h4 class="title">Total</h4>
                            <p class="quantity" id="total-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title">Today</h4>
                            <p class="quantity" id="today-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title">Week</h4>
                            <p class="quantity" id="week-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title"># Expenses</h4>
                            <p class="quantity" id="expense-count">0</p>
                        </div>

                    </div>

                </article>

                <article>

                    <h3>Expense Over Time</h3>

                    <div class="expenses-period">
                        <button id="weeklyCharts" class="active">Weekly</button>
                        <button id="monthlyCharts">Monthly</button>
                        <button id="yearlyCharts">Yearly</button>
                    </div>

                    <div class="chart">
                        <canvas id="expenseOverviewChart"></canvas>
                    </div>

                </article>

                <article>

                    <h3>Category Breakdown</h3>

                    <div class="chart">
                        <canvas id="categoryBreakdownChart"></canvas>
                    </div>

                </article>

                <article>

                    <h3>Recent Expenses</h3>

                    <div class="recent-expenses">

                        <table>
                            
                            <thead>
                                <tr class="expense">
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                </tr>
                            </thead>

                            <tbody>
                            </tbody>

                        </table>

                        <a href="expense.html" class="see-more"><button>See More</button></a>

                    </div>

                </article>

            </section>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
