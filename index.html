<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <main>

            <aside>
                <h1>Expense Tracker</h1>
                <nav>
                    <a href="index.html" class="active">Dashboard</a>
                    <a href="expense.html">Expenses</a>
                </nav>
            </aside>

            <section>

                <h2>Dashboard</h2>

                <article>

                    <h3>Expense Summary</h3>

                    <div class="expense-summary">

                        <div class="summary-card">
                            <h4 class="title">Total</h4>
                            <p class="quantity" id="total-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title">Today</h4>
                            <p class="quantity" id="today-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title">Week</h4>
                            <p class="quantity" id="week-expenses">PKR 0</p>
                        </div>

                        <div class="summary-card">
                            <h4 class="title"># Expenses</h4>
                            <p class="quantity" id="expense-count">0</p>
                        </div>

                    </div>

                </article>

                <article>

                    <h3>Expense Over Time</h3>

                    <div class="expenses-period">
                        <button class="active">Daily</button>
                        <button>Weekly</button>
                        <button>Monthly</button>
                        <button>Yearly</button>
                        <button>Custom</button>
                    </div>

                    <div class="expenses-period-chart">
                        <p>Expenses Over Time Chart Here...</p>
                    </div>

                </article>

                <article class="other-charts">

                    <div class="analytics-card">
                        <h3>Category Breakdown</h3>
                        <div class="chart">
                        </div>
                    </div>

                    <div class="analytics-card">
                        <h3>Other Analytics</h3>
                        <div class="chart">
                        </div>
                    </div>

                </article>

                <article>

                    <h3>Recent Expenses</h3>

                    <div class="recent-expenses">

                        <table>
                            
                            <thead>
                                <tr class="expense">
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                </tr>
                            </thead>

                            <tbody>
                            </tbody>

                        </table>

                    </div>

                </article>

            </section>

        </main>

        <script src="js/script.js"></script>

    </body>
</html>
